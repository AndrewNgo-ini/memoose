[project]
name = "memoose"
version = "0.2.0"
description = "Memory harness for coding agents: cognee-style graph memory exposed as MCP tools and skills, no API key."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Hieu Ngo" }]
keywords = ["memory", "mcp", "agent-plugins", "knowledge-graph", "claude-code", "codex"]
dependencies = [
  "mcp>=1.10",
  "pydantic>=2.7",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.5"]
ontology = ["rdflib>=7"]

[project.scripts]
memoose = "memoose.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoose"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
