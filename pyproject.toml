[project]
name = "memoose"
version = "0.4.0"
description = "A dual-path memory system for proactive agents: facts and procedures in a local graph, exposed as a CLI, MCP tools and skills, no API key."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Hieu Ngo" }]
keywords = ["memory", "mcp", "agent-plugins", "knowledge-graph", "claude-code", "codex"]
dependencies = [
  "mcp>=1.10",
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.5"]
ontology = ["rdflib>=7"]

[project.scripts]
memoose = "memoose.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The source distribution is the library and what `memoose install` needs; benchmarks, the docs
# site and benchmark results stay in the repository.
only-include = ["src", "harness", "tests", "README.md", "LICENSE", "CONTEXT.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/memoose"]

[tool.hatch.build.targets.wheel.force-include]
# `memoose install <host>` copies the harness (skills, hooks, agent) into the host, so the wheel must carry it.
"harness" = "memoose/harness"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
